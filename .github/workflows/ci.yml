name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows, Node 24, Chromium
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar repositorio
        run: pnpm check:repository

      - name: Formato, tipos y tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Guardar build de Studio para los shards E2E
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist
          if-no-files-found: error
          retention-days: 1

      - name: Revisar budgets de bundles
        run: pnpm check:budgets

      - name: Benchmark de exportación
        run: pnpm benchmark:export:ci
        env:
          SOLARA_EXPORT_BENCHMARK_BUDGET_MS: 60000
          SOLARA_EXPORT_BENCHMARK_FILES_BUDGET_BYTES: 52428800

  e2e:
    name: Windows, Node 24, Chromium — shard ${{ matrix.shard }}/4
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      PLAYWRIGHT_WORKERS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Recuperar build de Studio
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist

      - name: Instalar Chromium
        run: pnpm playwright:install:chromium

      - name: Playwright Chromium
        run: pnpm test:e2e:ci --shard=${{ matrix.shard }}/4

      - name: Publicar diagnóstico E2E
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  portable:
    name: Windows, portable E2E
    needs: [verify, e2e]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Recuperar build de Studio
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist

      - name: Construir shell portable
        run: pnpm desktop:package

      - name: Preparar fixture demo del portable
        run: pnpm portable:seed-demo

      - name: E2E portable
        run: pnpm test:e2e:portable

  portability:
    name: Linux, Node 24 (portabilidad Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm playwright:install:chromium

      - name: Formato, tipos y tests unitarios
        run: pnpm check

      - name: Tests adversariales (visuales dedicados excluidos en CI)
        run: pnpm exec playwright test tests/e2e/__bugs__ --workers=2 --retries=1

      - name: Build
        run: pnpm build
