name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows, Node 22, Chromium
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Revisar repositorio
        run: pnpm check:repository

      - name: Formato, tipos y tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Revisar budgets de bundles
        run: pnpm check:budgets

      - name: Benchmark de exportación
        run: pnpm benchmark:export

      - name: Instalar Chromium
        run: pnpm playwright:install:chromium

      - name: Playwright Chromium
        id: e2e
        run: pnpm test:e2e:ci

      - name: Publicar diagnóstico E2E
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
